name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    uses: rn-ax/poppycock/.github/workflows/ha-integration-ci.yml@main
    # `license`: upstream ships none and a fork cannot grant one.
    with:
      hacs_ignore: license
    secrets: inherit
